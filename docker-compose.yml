
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: diet_tracker
      PGUSER: diet_app
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: diet_tracker
      POSTGRES_USER: diet_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diet_app -d diet_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
